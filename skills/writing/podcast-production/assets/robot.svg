<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Podcast Production robot">
  <title>Podcast Production</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#293827" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a2619" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V16" stroke="#5ce047" stroke-width="3.5" stroke-linecap="round"/><circle cx="80" cy="12" r="6" fill="#5cf28e"><animate attributeName="r" values="6;8;6" dur="2.2s" repeatCount="indefinite"/></circle>
  <ellipse cx="80" cy="58" rx="35" ry="29" fill="#293827" stroke="#5ce047" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="59" y="51" width="14" height="14" rx="4" fill="#5cf28e"/><rect x="87" y="51" width="14" height="14" rx="4" fill="#5cf28e"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></rect></g>
  <path d="M68 76 h24" stroke="#5ce047" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#5ce047" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#293827" stroke="#5ce047" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="70" y="112" width="20" height="26" rx="10" fill="none" stroke="#5cf28e" stroke-width="3"/><path d="M60 132 a20 20 0 0 0 40 0" fill="none" stroke="#5cf28e" stroke-width="3" stroke-linecap="round"/><path d="M80 146 v8 M68 156 h24" stroke="#5cf28e" stroke-width="3" stroke-linecap="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#293827" stroke="#5ce047" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#293827" stroke="#5ce047" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#293827" stroke="#5ce047" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#293827" stroke="#5ce047" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#5cf28e" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#5cf28e" opacity="0.4"/>
</svg>
