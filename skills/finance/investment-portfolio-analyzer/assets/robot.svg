<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Investment Portfolio Analyzer robot">
  <title>Investment Portfolio Analyzer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#273827" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#192619" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V20" stroke="#4ae047" stroke-width="3.5" stroke-linecap="round"/><path d="M68 20 a12 8 0 0 1 24 0" fill="none" stroke="#4ae047" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="18" r="3.5" fill="#5cf29f"/>
  <rect x="46" y="30" width="68" height="56" rx="18" fill="#273827" stroke="#4ae047" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="58" y="54" width="16" height="8" rx="4" fill="#5cf29f"/><rect x="86" y="54" width="16" height="8" rx="4" fill="#5cf29f"><animate attributeName="width" values="16;9;16" dur="3.8s" repeatCount="indefinite"/></rect></g>
  <path d="M68 76 h24" stroke="#4ae047" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#4ae047" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#273827" stroke="#4ae047" stroke-width="3.5"/>
  <g filter="url(#glow)"><circle cx="80" cy="135" r="17" fill="none" stroke="#5cf29f" stroke-width="3"/><line x1="80" y1="135" x2="80" y2="118" stroke="#5cf29f" stroke-width="2.5"/><line x1="80" y1="135" x2="95" y2="143" stroke="#5cf29f" stroke-width="2.5"/><path d="M80 118 A17 17 0 0 1 95 143 L80 135 Z" fill="#5cf29f" opacity="0.55"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#273827" stroke="#4ae047" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#273827" stroke="#4ae047" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#273827" stroke="#4ae047" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#273827" stroke="#4ae047" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#5cf29f" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#5cf29f" opacity="0.4"/>
</svg>
