<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Retirement Calculator robot">
  <title>Retirement Calculator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27382f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#19261f" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V16" stroke="#47e091" stroke-width="3.5" stroke-linecap="round"/><circle cx="80" cy="12" r="6" fill="#5cf2ea"><animate attributeName="r" values="6;8;6" dur="2.2s" repeatCount="indefinite"/></circle>
  <path d="M80 28 L112 46 v30 L80 94 L48 76 V46 Z" fill="#27382f" stroke="#47e091" stroke-width="3.5" stroke-linejoin="round"/>
  <g filter="url(#glow)"><circle cx="66" cy="58" r="7" fill="#5cf2ea"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="94" cy="58" r="7" fill="#5cf2ea"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle></g>
  <path d="M68 76 h24" stroke="#47e091" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#47e091" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#27382f" stroke="#47e091" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M66 116 H94 L82 134 L94 152 H66 L78 134 Z" fill="none" stroke="#5cf2ea" stroke-width="3" stroke-linejoin="round"/><path d="M72 122 H88 L80 132 Z" fill="#5cf2ea" opacity="0.6"/><circle cx="80" cy="145" r="3.5" fill="#5cf2ea"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#27382f" stroke="#47e091" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#27382f" stroke="#47e091" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#27382f" stroke="#47e091" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#27382f" stroke="#47e091" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#5cf2ea" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#5cf2ea" opacity="0.4"/>
</svg>
