  <g filter="url(#glow)"><circle cx="66" cy="58" r="7" fill="#5c61f2"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="94" cy="58" r="7" fill="#5c61f2"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle></g>
  <path d="M68 76 h24" stroke="#4794e0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#4794e0" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#272f38" stroke="#4794e0" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="58" y="118" width="44" height="30" rx="3" fill="none" stroke="#5c61f2" stroke-width="2.5"/><circle cx="63" cy="123" r="1.4" fill="#5c61f2"/><circle cx="67" cy="123" r="1.4" fill="#5c61f2"/><circle cx="71" cy="123" r="1.4" fill="#5c61f2"/><path d="M60 128 h40" stroke="#5c61f2" stroke-width="1.5"/><path d="M65 134 h20 M65 140 h14" stroke="#5c61f2" stroke-width="1.5" stroke-linecap="round"/><circle cx="92" cy="146" r="5" fill="none" stroke="#5c61f2" stroke-width="2"/><path d="M96 150 l4 4" stroke="#5c61f2" stroke-width="2" stroke-linecap="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#272f38" stroke="#4794e0" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#272f38" stroke="#4794e0" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#272f38" stroke="#4794e0" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#272f38" stroke="#4794e0" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#5c61f2" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#5c61f2" opacity="0.4"/>
