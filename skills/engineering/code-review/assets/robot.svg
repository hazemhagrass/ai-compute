<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Code Review robot">
  <title>Code Review</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272e38" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#191e26" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V20" stroke="#4787e0" stroke-width="3.5" stroke-linecap="round"/><path d="M68 20 a12 8 0 0 1 24 0" fill="none" stroke="#4787e0" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="18" r="3.5" fill="#635cf2"/>
  <path d="M80 28 L112 46 v30 L80 94 L48 76 V46 Z" fill="#272e38" stroke="#4787e0" stroke-width="3.5" stroke-linejoin="round"/>
  <g filter="url(#glow)"><rect x="59" y="51" width="14" height="14" rx="4" fill="#635cf2"/><rect x="87" y="51" width="14" height="14" rx="4" fill="#635cf2"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></rect></g>
  <path d="M68 76 h24" stroke="#4787e0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#4787e0" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#272e38" stroke="#4787e0" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M68 124 l-10 12 10 12" fill="none" stroke="#635cf2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 124 l10 12 -10 12" fill="none" stroke="#635cf2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 120 l-12 32" stroke="#635cf2" stroke-width="3" stroke-linecap="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#272e38" stroke="#4787e0" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#272e38" stroke="#4787e0" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#272e38" stroke="#4787e0" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#272e38" stroke="#4787e0" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#635cf2" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#635cf2" opacity="0.4"/>
</svg>
