<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="SQL Optimization robot">
  <title>SQL Optimization</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272c38" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#191d26" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 C80 20 92 22 90 14" fill="none" stroke="#477ae0" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="11" r="5" fill="#705cf2"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <rect x="46" y="32" width="68" height="54" rx="26" fill="#272c38" stroke="#477ae0" stroke-width="3.5"/><path d="M52 58 h56" stroke="#477ae0" stroke-width="2" opacity="0.45"/>
  <g filter="url(#glow)"><rect x="59" y="51" width="14" height="14" rx="4" fill="#705cf2"/><rect x="87" y="51" width="14" height="14" rx="4" fill="#705cf2"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></rect></g>
  <path d="M68 76 h24" stroke="#477ae0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#477ae0" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#272c38" stroke="#477ae0" stroke-width="3.5"/>
  <g filter="url(#glow)"><ellipse cx="74" cy="124" rx="15" ry="5" fill="none" stroke="#705cf2" stroke-width="3"/><path d="M59 124 v16 c0 3 7 5 15 5 s15 -2 15 -5 v-16" fill="none" stroke="#705cf2" stroke-width="3"/><path d="M92 140 l10 10" stroke="#705cf2" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="138" r="6" fill="none" stroke="#705cf2" stroke-width="3"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#272c38" stroke="#477ae0" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#272c38" stroke="#477ae0" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#272c38" stroke="#477ae0" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#272c38" stroke="#477ae0" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#705cf2" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#705cf2" opacity="0.4"/>
</svg>
