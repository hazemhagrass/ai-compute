<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="160" height="190" role="img" aria-label="Refactoring robot">
  <title>Refactoring</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334d50" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1c3235" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="160" height="190" rx="18" fill="url(#bg)"/>
  <g filter="url(#glow)"><rect x="66" y="22" width="28" height="8" rx="4" fill="#46d1e1"/><rect x="76" y="28" width="8" height="8" fill="#46d1e1"/></g>
  <rect x="34" y="36" width="92" height="66" rx="33" fill="#334d50" stroke="#46d1e1" stroke-width="3"/>
  <g filter="url(#glow)"><ellipse cx="62" cy="68" rx="9" ry="9" fill="#4772ea"><animate attributeName="ry" values="9;9;1;9;9" dur="4.2s" repeatCount="indefinite"/></ellipse><ellipse cx="98" cy="68" rx="9" ry="9" fill="#4772ea"><animate attributeName="ry" values="9;9;1;9;9" dur="4.2s" repeatCount="indefinite"/></ellipse></g>
  <path d="M68 92 h24" stroke="#46d1e1" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <rect x="74" y="104" width="12" height="8" fill="#46d1e1" opacity="0.8"/>
  <rect x="48" y="112" width="64" height="48" rx="12" fill="#334d50" stroke="#46d1e1" stroke-width="3"/>
  <g filter="url(#glow)"><path d="M66 126 h12 v12 h12" stroke="#4772ea" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M90 134 l6 4 -6 4z" fill="#4772ea"/></g>
  <rect x="30" y="118" width="14" height="34" rx="7" fill="#334d50" stroke="#46d1e1" stroke-width="3"/>
  <rect x="116" y="118" width="14" height="34" rx="7" fill="#334d50" stroke="#46d1e1" stroke-width="3"/>
  <rect x="58" y="160" width="14" height="18" rx="5" fill="#334d50" stroke="#46d1e1" stroke-width="3"/>
  <rect x="88" y="160" width="14" height="18" rx="5" fill="#334d50" stroke="#46d1e1" stroke-width="3"/>
  <circle cx="24" cy="46" r="3" fill="#4772ea" opacity="0.65"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="138" cy="70" r="2.5" fill="#4772ea" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="30" cy="168" r="2" fill="#46d1e1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.8s" repeatCount="indefinite"/></circle>
</svg>
