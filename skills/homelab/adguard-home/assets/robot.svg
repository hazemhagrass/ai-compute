<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="AdGuard Home robot">
  <title>AdGuard Home</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#382f27" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#261f19" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V16" stroke="#e08f47" stroke-width="3.5" stroke-linecap="round"/><circle cx="80" cy="12" r="6" fill="#f2e85c"><animate attributeName="r" values="6;8;6" dur="2.2s" repeatCount="indefinite"/></circle>
  <path d="M80 28 L112 46 v30 L80 94 L48 76 V46 Z" fill="#382f27" stroke="#e08f47" stroke-width="3.5" stroke-linejoin="round"/>
  <g filter="url(#glow)"><rect x="58" y="54" width="16" height="8" rx="4" fill="#f2e85c"/><rect x="86" y="54" width="16" height="8" rx="4" fill="#f2e85c"><animate attributeName="width" values="16;9;16" dur="3.8s" repeatCount="indefinite"/></rect></g>
  <path d="M68 76 h24" stroke="#e08f47" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e08f47" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#382f27" stroke="#e08f47" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M80 119 l17 7 v13 q0 13 -17 20 q-17 -7 -17 -20 v-13z" fill="none" stroke="#f2e85c" stroke-width="3" stroke-linejoin="round"/><circle cx="80" cy="139" r="8" fill="none" stroke="#f2e85c" stroke-width="2.5"/><path d="M73 139 h14" stroke="#f2e85c" stroke-width="2.5" stroke-linecap="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#382f27" stroke="#e08f47" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#382f27" stroke="#e08f47" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#382f27" stroke="#e08f47" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#382f27" stroke="#e08f47" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#f2e85c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#f2e85c" opacity="0.4"/>
