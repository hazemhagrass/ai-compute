<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="code-graph robot">
  <title>code-graph</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2738" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1c1926" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M62 32 L56 18" stroke="#7047e0" stroke-width="3" stroke-linecap="round"/><path d="M98 32 L104 18" stroke="#7047e0" stroke-width="3" stroke-linecap="round"/><circle cx="56" cy="15" r="4.5" fill="#ca5cf2"/><circle cx="104" cy="15" r="4.5" fill="#ca5cf2"/>
  <rect x="46" y="30" width="68" height="56" rx="18" fill="#2b2738" stroke="#7047e0" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="58" y="54" width="16" height="8" rx="4" fill="#ca5cf2"/><rect x="86" y="54" width="16" height="8" rx="4" fill="#ca5cf2"><animate attributeName="width" values="16;9;16" dur="3.8s" repeatCount="indefinite"/></rect></g>
  <path d="M68 76 h24" stroke="#7047e0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#7047e0" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#2b2738" stroke="#7047e0" stroke-width="3.5"/>
  <g filter="url(#glow)"><circle cx="80" cy="124" r="6" fill="none" stroke="#ca5cf2" stroke-width="2.5"/><circle cx="64" cy="148" r="6" fill="none" stroke="#ca5cf2" stroke-width="2.5"/><circle cx="96" cy="148" r="6" fill="none" stroke="#ca5cf2" stroke-width="2.5"/><path d="M76 129 l-8 14 M84 129 l8 14 M70 148 h20" stroke="#ca5cf2" stroke-width="2.5"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#2b2738" stroke="#7047e0" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#2b2738" stroke="#7047e0" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#2b2738" stroke="#7047e0" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#2b2738" stroke="#7047e0" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#ca5cf2" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#ca5cf2" opacity="0.4"/>
</svg>
