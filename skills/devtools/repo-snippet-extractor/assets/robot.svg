<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Repo Snippet Extractor robot">
  <title>Repo Snippet Extractor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282738" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1926" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V20" stroke="#5747e0" stroke-width="3.5" stroke-linecap="round"/><path d="M68 20 a12 8 0 0 1 24 0" fill="none" stroke="#5747e0" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="18" r="3.5" fill="#b15cf2"/>
  <path d="M80 28 L112 46 v30 L80 94 L48 76 V46 Z" fill="#282738" stroke="#5747e0" stroke-width="3.5" stroke-linejoin="round"/>
  <g filter="url(#glow)"><rect x="59" y="51" width="14" height="14" rx="4" fill="#b15cf2"/><rect x="87" y="51" width="14" height="14" rx="4" fill="#b15cf2"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></rect></g>
  <path d="M68 76 h24" stroke="#5747e0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#5747e0" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#282738" stroke="#5747e0" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M66 124 h20 l8 8 v22 H66z" fill="none" stroke="#b15cf2" stroke-width="2.5" stroke-linejoin="round"/><path d="M86 124 v8 h8" fill="none" stroke="#b15cf2" stroke-width="2.5" stroke-linejoin="round"/><path d="M74 140 l-4 4 4 4 M82 140 l4 4 -4 4" fill="none" stroke="#b15cf2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#282738" stroke="#5747e0" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#282738" stroke="#5747e0" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#282738" stroke="#5747e0" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#282738" stroke="#5747e0" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#b15cf2" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#b15cf2" opacity="0.4"/>
</svg>
