  <g filter="url(#glow)"><circle cx="66" cy="58" r="7" fill="#845cf2"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="94" cy="58" r="7" fill="#845cf2"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle></g>
  <path d="M68 76 h24" stroke="#4766e0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#4766e0" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#272a38" stroke="#4766e0" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="56" y="120" width="48" height="34" rx="4" fill="none" stroke="#845cf2" stroke-width="3"/><path d="M64 132 l7 6 -7 6" fill="none" stroke="#845cf2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 144 h14" stroke="#845cf2" stroke-width="2.5" stroke-linecap="round"/><path d="M92 126 l4 -4 4 4" fill="none" stroke="#845cf2" stroke-width="2.5" stroke-linecap="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#272a38" stroke="#4766e0" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#272a38" stroke="#4766e0" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#272a38" stroke="#4766e0" stroke-width="3"/>
