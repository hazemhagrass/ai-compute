<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="shell-history-alias-miner robot">
  <title>shell-history-alias-miner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272a38" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#191b26" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V20" stroke="#4766e0" stroke-width="3.5" stroke-linecap="round"/><path d="M68 20 a12 8 0 0 1 24 0" fill="none" stroke="#4766e0" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="18" r="3.5" fill="#845cf2"/>
