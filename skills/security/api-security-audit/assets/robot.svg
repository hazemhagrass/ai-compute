<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="API Security Audit robot">
  <title>API Security Audit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38272c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#26191c" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V16" stroke="#e04773" stroke-width="3.5" stroke-linecap="round"/><circle cx="80" cy="12" r="6" fill="#f2775c"><animate attributeName="r" values="6;8;6" dur="2.2s" repeatCount="indefinite"/></circle>
  <rect x="46" y="30" width="68" height="56" rx="18" fill="#38272c" stroke="#e04773" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="59" y="51" width="14" height="14" rx="4" fill="#f2775c"/><rect x="87" y="51" width="14" height="14" rx="4" fill="#f2775c"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></rect></g>
  <path d="M68 76 h24" stroke="#e04773" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e04773" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#38272c" stroke="#e04773" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M62 122 h36 v30 h-36z" fill="none" stroke="#f2775c" stroke-width="3" stroke-linejoin="round"/><path d="M62 132 h36" stroke="#f2775c" stroke-width="2.5"/><circle cx="68" cy="127" r="2" fill="#f2775c"/><path d="M70 141 l-6 5 6 5 M90 141 l6 5 -6 5" fill="none" stroke="#f2775c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#38272c" stroke="#e04773" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#38272c" stroke="#e04773" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#38272c" stroke="#e04773" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#38272c" stroke="#e04773" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#f2775c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#f2775c" opacity="0.4"/>
</svg>
