<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Security Audit robot">
  <title>Security Audit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#273338" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#192226" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 C80 20 92 22 90 14" fill="none" stroke="#47b2e0" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="11" r="5" fill="#5c7ff2"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <rect x="46" y="30" width="68" height="56" rx="18" fill="#273338" stroke="#47b2e0" stroke-width="3.5"/>
  <g filter="url(#glow)"><circle cx="66" cy="58" r="7" fill="#5c7ff2"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="94" cy="58" r="7" fill="#5c7ff2"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle></g>
  <path d="M68 76 h24" stroke="#47b2e0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#47b2e0" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#273338" stroke="#47b2e0" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M80 118 l16 7 v12 c0 10 -7 17 -16 20 -9 -3 -16 -10 -16 -20 v-12z" fill="none" stroke="#5c7ff2" stroke-width="3" stroke-linejoin="round"/><path d="M73 137 l5 5 10 -10" fill="none" stroke="#5c7ff2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#273338" stroke="#47b2e0" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#273338" stroke="#47b2e0" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#273338" stroke="#47b2e0" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#273338" stroke="#47b2e0" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#5c7ff2" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#5c7ff2" opacity="0.4"/>
