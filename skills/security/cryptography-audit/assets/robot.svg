<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Cryptography Audit robot">
  <title>Cryptography Audit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#382827" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#261a19" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V20" stroke="#e05147" stroke-width="3.5" stroke-linecap="round"/><path d="M68 20 a12 8 0 0 1 24 0" fill="none" stroke="#e05147" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="18" r="3.5" fill="#f2ac5c"/>
  <ellipse cx="80" cy="58" rx="35" ry="29" fill="#382827" stroke="#e05147" stroke-width="3.5"/>
  <g filter="url(#glow)"><ellipse cx="66" cy="58" rx="7" ry="7" fill="#f2ac5c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse><ellipse cx="94" cy="58" rx="7" ry="7" fill="#f2ac5c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse></g>
  <path d="M68 76 h24" stroke="#e05147" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e05147" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#382827" stroke="#e05147" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="60" y="126" width="40" height="28" rx="4" fill="none" stroke="#f2ac5c" stroke-width="3"/><path d="M67 134 l5 6 -5 6" fill="none" stroke="#f2ac5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 146 h14" stroke="#f2ac5c" stroke-width="2.5" stroke-linecap="round"/><path d="M72 126 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#f2ac5c" stroke-width="2.5"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#382827" stroke="#e05147" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#382827" stroke="#e05147" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#382827" stroke="#e05147" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#382827" stroke="#e05147" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#f2ac5c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#f2ac5c" opacity="0.4"/>
</svg>
