<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="SmythOS SDK Skill robot">
  <title>SmythOS SDK Skill</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38272d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#26191e" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V16" stroke="#e04782" stroke-width="3.5" stroke-linecap="round"/><circle cx="80" cy="12" r="6" fill="#f2685c"><animate attributeName="r" values="6;8;6" dur="2.2s" repeatCount="indefinite"/></circle>
  <rect x="46" y="32" width="68" height="54" rx="26" fill="#38272d" stroke="#e04782" stroke-width="3.5"/><path d="M52 58 h56" stroke="#e04782" stroke-width="2" opacity="0.45"/>
  <g filter="url(#glow)"><circle cx="66" cy="58" r="7" fill="#f2685c"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="94" cy="58" r="7" fill="#f2685c"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle></g>
  <path d="M68 76 h24" stroke="#e04782" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e04782" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#38272d" stroke="#e04782" stroke-width="3.5"/>
  <g filter="url(#glow)"><circle cx="80" cy="136" r="7" fill="none" stroke="#f2685c" stroke-width="3"/><circle cx="60" cy="124" r="4.5" fill="none" stroke="#f2685c" stroke-width="2.5"/><circle cx="100" cy="124" r="4.5" fill="none" stroke="#f2685c" stroke-width="2.5"/><circle cx="80" cy="154" r="4.5" fill="none" stroke="#f2685c" stroke-width="2.5"/><path d="M75 131 l-11 -5 M85 131 l11 -5 M80 143 v7" stroke="#f2685c" stroke-width="2.5"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#38272d" stroke="#e04782" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#38272d" stroke="#e04782" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#38272d" stroke="#e04782" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#38272d" stroke="#e04782" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#f2685c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#f2685c" opacity="0.4"/>
</svg>
