<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Excel Formulas robot">
  <title>Excel Formulas</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383327" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#262219" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 C80 20 92 22 90 14" fill="none" stroke="#e0b247" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="11" r="5" fill="#d9f25c"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <ellipse cx="80" cy="58" rx="35" ry="29" fill="#383327" stroke="#e0b247" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="58" y="54" width="16" height="8" rx="4" fill="#d9f25c"/><rect x="86" y="54" width="16" height="8" rx="4" fill="#d9f25c"><animate attributeName="width" values="16;9;16" dur="3.8s" repeatCount="indefinite"/></rect></g>
  <path d="M68 76 h24" stroke="#e0b247" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e0b247" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#383327" stroke="#e0b247" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="56" y="118" width="48" height="38" rx="4" fill="none" stroke="#d9f25c" stroke-width="3"/><path d="M56 130 h48" stroke="#d9f25c" stroke-width="2.5"/><path d="M64 140 l6 8 M70 140 l-6 8" stroke="#d9f25c" stroke-width="2.5" stroke-linecap="round"/><path d="M80 148 h4 a5 5 0 0 0 5 -5 v-3" fill="none" stroke="#d9f25c" stroke-width="2.5" stroke-linecap="round"/><circle cx="96" cy="138" r="2.5" fill="#d9f25c"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#383327" stroke="#e0b247" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#383327" stroke="#e0b247" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#383327" stroke="#e0b247" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#383327" stroke="#e0b247" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#d9f25c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#d9f25c" opacity="0.4"/>
</svg>
