<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Excel Financial Modeling robot">
  <title>Excel Financial Modeling</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383227" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#262219" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M62 32 L56 18" stroke="#e0b047" stroke-width="3" stroke-linecap="round"/><path d="M98 32 L104 18" stroke="#e0b047" stroke-width="3" stroke-linecap="round"/><circle cx="56" cy="15" r="4.5" fill="#dbf25c"/><circle cx="104" cy="15" r="4.5" fill="#dbf25c"/>
  <rect x="46" y="30" width="68" height="56" rx="18" fill="#383227" stroke="#e0b047" stroke-width="3.5"/>
  <g filter="url(#glow)"><circle cx="66" cy="58" r="7" fill="#dbf25c"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="94" cy="58" r="7" fill="#dbf25c"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle></g>
  <path d="M68 76 h24" stroke="#e0b047" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e0b047" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#383227" stroke="#e0b047" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M60 150 v-26 M60 150 h42" stroke="#dbf25c" stroke-width="3" stroke-linecap="round"/><path d="M66 142 l10 -10 8 7 12 -15" fill="none" stroke="#dbf25c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="96" cy="124" r="3" fill="#dbf25c"/><path d="M80 152 v4 M92 152 v4" stroke="#dbf25c" stroke-width="2"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#383227" stroke="#e0b047" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#383227" stroke="#e0b047" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#383227" stroke="#e0b047" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#383227" stroke="#e0b047" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#dbf25c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#dbf25c" opacity="0.4"/>
</svg>
