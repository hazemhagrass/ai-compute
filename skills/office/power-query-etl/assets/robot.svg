<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Power Query ETL robot">
  <title>Power Query ETL</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#382e27" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#261e19" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V20" stroke="#e08747" stroke-width="3.5" stroke-linecap="round"/><path d="M68 20 a12 8 0 0 1 24 0" fill="none" stroke="#e08747" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="18" r="3.5" fill="#f2e05c"/>
  <rect x="46" y="30" width="68" height="56" rx="18" fill="#382e27" stroke="#e08747" stroke-width="3.5"/>
  <g filter="url(#glow)"><ellipse cx="66" cy="58" rx="7" ry="7" fill="#f2e05c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse><ellipse cx="94" cy="58" rx="7" ry="7" fill="#f2e05c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse></g>
  <path d="M68 76 h24" stroke="#e08747" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e08747" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#382e27" stroke="#e08747" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M60 124 h16 v10 H60z M60 142 h16 v10 H60z" fill="none" stroke="#f2e05c" stroke-width="2.5"/><path d="M88 128 h14 v20 H88z" fill="none" stroke="#f2e05c" stroke-width="2.5"/><path d="M76 129 q8 0 8 9 t8 9" fill="none" stroke="#f2e05c" stroke-width="2.5"/><path d="M76 147 q8 0 8 -9" fill="none" stroke="#f2e05c" stroke-width="2.5"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#382e27" stroke="#e08747" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#382e27" stroke="#e08747" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#382e27" stroke="#e08747" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#382e27" stroke="#e08747" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#f2e05c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#f2e05c" opacity="0.4"/>
</svg>
