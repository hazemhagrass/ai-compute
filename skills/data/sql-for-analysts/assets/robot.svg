<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="SQL for Analysts robot">
  <title>SQL for Analysts</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#273836" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#192624" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M62 32 L56 18" stroke="#47e0ce" stroke-width="3" stroke-linecap="round"/><path d="M98 32 L104 18" stroke="#47e0ce" stroke-width="3" stroke-linecap="round"/><circle cx="56" cy="15" r="4.5" fill="#5cbdf2"/><circle cx="104" cy="15" r="4.5" fill="#5cbdf2"/>
  <path d="M80 28 L112 46 v30 L80 94 L48 76 V46 Z" fill="#273836" stroke="#47e0ce" stroke-width="3.5" stroke-linejoin="round"/>
  <g filter="url(#glow)"><ellipse cx="66" cy="58" rx="7" ry="7" fill="#5cbdf2"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse><ellipse cx="94" cy="58" rx="7" ry="7" fill="#5cbdf2"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse></g>
  <path d="M68 76 h24" stroke="#47e0ce" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#47e0ce" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#273836" stroke="#47e0ce" stroke-width="3.5"/>
  <g filter="url(#glow)"><ellipse cx="80" cy="126" rx="16" ry="6" fill="none" stroke="#5cbdf2" stroke-width="3"/><path d="M64 126 v20 c0 3.5 7.5 6 16 6 s16 -2.5 16 -6 v-20" fill="none" stroke="#5cbdf2" stroke-width="3"/><path d="M64 136 c0 3.5 7.5 6 16 6 s16 -2.5 16 -6" fill="none" stroke="#5cbdf2" stroke-width="2.5"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#273836" stroke="#47e0ce" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#273836" stroke="#47e0ce" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#273836" stroke="#47e0ce" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#273836" stroke="#47e0ce" stroke-width="3"/>

