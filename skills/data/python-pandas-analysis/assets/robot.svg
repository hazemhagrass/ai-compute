<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Python Pandas Analysis robot">
  <title>Python Pandas Analysis</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#273833" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#192622" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 C80 20 92 22 90 14" fill="none" stroke="#47e0b7" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="11" r="5" fill="#5cd4f2"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <ellipse cx="80" cy="58" rx="35" ry="29" fill="#273833" stroke="#47e0b7" stroke-width="3.5"/>
  <g filter="url(#glow)"><ellipse cx="66" cy="58" rx="7" ry="7" fill="#5cd4f2"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse><ellipse cx="94" cy="58" rx="7" ry="7" fill="#5cd4f2"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse></g>
  <path d="M68 76 h24" stroke="#47e0b7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#47e0b7" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#273833" stroke="#47e0b7" stroke-width="3.5"/>
  <g filter="url(#glow)"><rect x="56" y="118" width="48" height="38" rx="4" fill="none" stroke="#5cd4f2" stroke-width="3"/><path d="M56 128 h48 M72 118 v38 M88 118 v38" stroke="#5cd4f2" stroke-width="2.5"/><path d="M60 140 h8 M76 146 h8" stroke="#5cd4f2" stroke-width="2.5" stroke-linecap="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#273833" stroke="#47e0b7" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#273833" stroke="#47e0b7" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#273833" stroke="#47e0b7" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#273833" stroke="#47e0b7" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#5cd4f2" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#5cd4f2" opacity="0.4"/>
</svg>
