<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Course Creation robot">
  <title>Course Creation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353827" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#242619" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V20" stroke="#c6e047" stroke-width="3.5" stroke-linecap="round"/><path d="M68 20 a12 8 0 0 1 24 0" fill="none" stroke="#c6e047" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="18" r="3.5" fill="#93f25c"/>
  <rect x="46" y="32" width="68" height="54" rx="26" fill="#353827" stroke="#c6e047" stroke-width="3.5"/><path d="M52 58 h56" stroke="#c6e047" stroke-width="2" opacity="0.45"/>
  <g filter="url(#glow)"><circle cx="66" cy="58" r="7" fill="#93f25c"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="94" cy="58" r="7" fill="#93f25c"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" repeatCount="indefinite"/></circle></g>
  <path d="M68 76 h24" stroke="#c6e047" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#c6e047" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#353827" stroke="#c6e047" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M80 119 L102 128 L80 137 L58 128 Z" fill="none" stroke="#93f25c" stroke-width="3" stroke-linejoin="round"/><path d="M68 132 V143 a12 7 0 0 0 24 0 V132" fill="none" stroke="#93f25c" stroke-width="3"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#353827" stroke="#c6e047" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#353827" stroke="#c6e047" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#353827" stroke="#c6e047" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#353827" stroke="#c6e047" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#93f25c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#93f25c" opacity="0.4"/>
</svg>
