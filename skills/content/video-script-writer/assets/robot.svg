<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Video Script Writer robot">
  <title>Video Script Writer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#303827" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#202619" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 V16" stroke="#99e047" stroke-width="3.5" stroke-linecap="round"/><circle cx="80" cy="12" r="6" fill="#66f25c"><animate attributeName="r" values="6;8;6" dur="2.2s" repeatCount="indefinite"/></circle>
  <ellipse cx="80" cy="58" rx="35" ry="29" fill="#303827" stroke="#99e047" stroke-width="3.5"/>
  <g filter="url(#glow)"><ellipse cx="66" cy="58" rx="7" ry="7" fill="#66f25c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse><ellipse cx="94" cy="58" rx="7" ry="7" fill="#66f25c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse></g>
  <path d="M68 76 h24" stroke="#99e047" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#99e047" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#303827" stroke="#99e047" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M58 126 h44 v26 H58z" fill="none" stroke="#66f25c" stroke-width="3" stroke-linejoin="round"/><path d="M58 126 l6 -10 h44 l-6 10" fill="none" stroke="#66f25c" stroke-width="3" stroke-linejoin="round"/><path d="M72 116 l-6 10 M86 116 l-6 10" stroke="#66f25c" stroke-width="2.5"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#303827" stroke="#99e047" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#303827" stroke="#99e047" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#303827" stroke="#99e047" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#303827" stroke="#99e047" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#66f25c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#66f25c" opacity="0.4"/>
</svg>
