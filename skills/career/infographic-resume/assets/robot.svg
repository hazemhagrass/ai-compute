<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Infographic Resume robot">
  <title>Infographic Resume</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#382b27" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#261c19" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M62 32 L56 18" stroke="#e06d47" stroke-width="3" stroke-linecap="round"/><path d="M98 32 L104 18" stroke="#e06d47" stroke-width="3" stroke-linecap="round"/><circle cx="56" cy="15" r="4.5" fill="#f2c75c"/><circle cx="104" cy="15" r="4.5" fill="#f2c75c"/>
  <rect x="46" y="30" width="68" height="56" rx="18" fill="#382b27" stroke="#e06d47" stroke-width="3.5"/>
  <g filter="url(#glow)"><ellipse cx="66" cy="58" rx="7" ry="7" fill="#f2c75c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse><ellipse cx="94" cy="58" rx="7" ry="7" fill="#f2c75c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse></g>
  <path d="M68 76 h24" stroke="#e06d47" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e06d47" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#382b27" stroke="#e06d47" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M64 152 v-22 h8 v22 M78 152 v-32 h8 v32 M92 152 v-16 h8 v16" fill="none" stroke="#f2c75c" stroke-width="3" stroke-linejoin="round"/><circle cx="76" cy="120" r="5" fill="none" stroke="#f2c75c" stroke-width="2.5"/><path d="M106 116 v36" stroke="#f2c75c" stroke-width="2.5" stroke-linecap="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#382b27" stroke="#e06d47" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#382b27" stroke="#e06d47" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#382b27" stroke="#e06d47" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#382b27" stroke="#e06d47" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#f2c75c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#f2c75c" opacity="0.4"/>
</svg>
