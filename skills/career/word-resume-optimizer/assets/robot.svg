<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Word Resume Optimizer robot">
  <title>Word Resume Optimizer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#382c27" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#261d19" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M80 30 C80 20 92 22 90 14" fill="none" stroke="#e07847" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="11" r="5" fill="#f2d15c"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <rect x="46" y="30" width="68" height="56" rx="18" fill="#382c27" stroke="#e07847" stroke-width="3.5"/>
  <g filter="url(#glow)"><ellipse cx="66" cy="58" rx="7" ry="7" fill="#f2d15c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse><ellipse cx="94" cy="58" rx="7" ry="7" fill="#f2d15c"><animate attributeName="ry" values="7;7;1;7;7" dur="4.6s" repeatCount="indefinite"/></ellipse></g>
  <path d="M68 76 h24" stroke="#e07847" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e07847" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#382c27" stroke="#e07847" stroke-width="3.5"/>
  <g filter="url(#glow)"><path d="M62 112 h36 v50 H62z" fill="none" stroke="#f2d15c" stroke-width="3" stroke-linejoin="round"/><path d="M68 122 h24 M68 130 h24 M68 138 h24 M68 146 h16" stroke="#f2d15c" stroke-width="2.5" stroke-linecap="round"/><path d="M88 130 l12 12 M100 130 l-12 12" stroke="#f2d15c" stroke-width="2.5" stroke-linecap="round"/></g>

  <rect x="26" y="116" width="14" height="38" rx="7" fill="#382c27" stroke="#e07847" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#382c27" stroke="#e07847" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#382c27" stroke="#e07847" stroke-width="3"/>
  <rect x="88" y="164" width="14" height="20" rx="6" fill="#382c27" stroke="#e07847" stroke-width="3"/>

  <circle cx="22" cy="40" r="2.5" fill="#f2d15c" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="176" r="2" fill="#f2d15c" opacity="0.4"/>
</svg>
