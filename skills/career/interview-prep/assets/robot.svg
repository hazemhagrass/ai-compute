  </defs>

  <rect width="160" height="200" rx="20" fill="url(#bg)"/>

  <path d="M62 32 L56 18" stroke="#e09147" stroke-width="3" stroke-linecap="round"/><path d="M98 32 L104 18" stroke="#e09147" stroke-width="3" stroke-linecap="round"/><circle cx="56" cy="15" r="4.5" fill="#f2ea5c"/><circle cx="104" cy="15" r="4.5" fill="#f2ea5c"/>
