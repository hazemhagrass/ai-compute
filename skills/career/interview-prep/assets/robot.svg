  <rect x="26" y="116" width="14" height="38" rx="7" fill="#382f27" stroke="#e09147" stroke-width="3"/>
  <rect x="120" y="116" width="14" height="38" rx="7" fill="#382f27" stroke="#e09147" stroke-width="3"/>
  <rect x="58" y="164" width="14" height="20" rx="6" fill="#382f27" stroke="#e09147" stroke-width="3"/>
