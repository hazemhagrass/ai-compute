  <path d="M68 76 h24" stroke="#e09947" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M80 86 v14" stroke="#e09947" stroke-width="3"/>
  <rect x="44" y="108" width="72" height="56" rx="14" fill="#383027" stroke="#e09947" stroke-width="3.5"/>
