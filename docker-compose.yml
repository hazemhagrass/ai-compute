services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-model-router:latest
    container_name: ai-model-router

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"

      AMR_DATA_DIR: /data
      AMR_DB_PATH: /data/router.db

      AMR_SECRET: ${AMR_SECRET:-}

    volumes:
      - amr-data:/data

    healthcheck:
      start_period: 40s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  amr-data:
    driver: local
