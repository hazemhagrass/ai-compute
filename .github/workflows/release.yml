name: release

# Auto-publish (#150). Any change under skills/ on main cuts a release:
# validate first, then tag, then publish. The marketplace is consumed
# straight from the tagged git ref, so "publishing" means moving a tag
# consumers can pin, plus a GitHub Release carrying the changelog.
#
# Rollback story: releases are immutable tags. To undo a bad release,
# revert the offending commit on main and let this workflow cut the next
# patch version. Consumers pinned to the previous tag are unaffected;
# consumers tracking main get the revert on their next update.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and compute the version, but do not tag or publish'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gen-release.py reads tags and the log since the last one

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The gate runs again here even though CI ran it on the same commit:
      # a release is the last point where a bad skill can still be stopped,
      # and re-running costs seconds.
      - name: Validate skills
        run: bash scripts/doctor.sh
        env:
          DOCTOR_LOCAL: '0'

      - name: Manifest freshness
        run: python3 scripts/gen-manifest.py --check

      - name: Robot art present and unique
        run: python3 scripts/gen-robot.py --check

      - name: Security scan
        run: python3 scripts/scan-skills.py

      - name: Marketplace manifest freshness
        run: python3 scripts/gen-marketplace.py --check

      - name: Compute next version
        id: version
        run: python3 scripts/gen-release.py --output "$GITHUB_OUTPUT"

      - name: Dry run summary
        if: inputs.dry_run
        run: |
          echo "DRY RUN: would release ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.version.outputs.notes_path }} contents:" >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.version.outputs.notes_path }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and publish
        if: ${{ !inputs.dry_run && steps.version.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes_path }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --notes-file "$NOTES"

      - name: No release needed
        if: ${{ steps.version.outputs.changed != 'true' }}
        run: echo "No skill content changed since the last tag." >> "$GITHUB_STEP_SUMMARY"
