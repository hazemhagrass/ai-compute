name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: skill library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Skill structure (scripts/doctor.sh)
        run: bash scripts/doctor.sh
        env:
          DOCTOR_LOCAL: '0'

      - name: Manifest freshness
        run: python3 scripts/gen-manifest.py --check

      - name: Robot art present and unique
        run: python3 scripts/gen-robot.py --check

      - name: Security scan
        run: python3 scripts/scan-skills.py

      - name: Prose quality scan
        run: python3 scripts/scan-filler.py

      - name: Marketplace manifest freshness
        run: python3 scripts/gen-marketplace.py --check

  router:
    name: ai-model-router
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-model-router

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ai-model-router/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint src --max-warnings 0

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  plans:
    name: plans in sync
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check derived progress numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-plans.mjs --write
          if ! git diff --quiet docs/plans; then
            echo "::error::docs/plans is stale. Run: node scripts/sync-plans.mjs --write"
            git diff --stat docs/plans
            exit 1
          fi
